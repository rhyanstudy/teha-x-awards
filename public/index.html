<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <meta name="description" content="Cédula oficial do Teha X Awards.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Teha X Awards</title>
  <link rel="icon" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="preload" as="image" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="glow"></div>
    <div class="rays"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>
  <button id="music" class="music" type="button" aria-label="Silenciar música" aria-pressed="true">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path fill="currentColor" d="M3 10h3.2L11 6.2v11.6L6.2 14H3z"/>
      <path class="wave" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M15 9.5a3.5 3.5 0 0 1 0 5"/>
      <path class="wave" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M17.2 7a6.5 6.5 0 0 1 0 10"/>
      <path class="slash" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M5 19L19 5"/>
    </svg>
  </button>
  <main id="app">
    <p class="booting">Abrindo a cerimônia…</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="ceremony-audio" preload="none"></audio>
  <audio id="defense-audio" preload="none"></audio>
  <noscript><p class="booting">A cerimônia precisa de JavaScript.</p></noscript>
  <script src="/app.js"></script>
</body>
</html>
